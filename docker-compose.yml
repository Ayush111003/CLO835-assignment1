version: '3.8'
services:
  mysql:
    image: ap1110/clo835-mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
    networks:
      - clo835-net

  blue:
    image: ap1110/clo835-webapp:latest
    container_name: blue
    environment:
      APP_COLOR: blue
      DBHOST: mysql
      DBPWD: password
      DBPORT: 3306
      DBUSER: root
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - clo835-net

  pink:
    image: ap1110/clo835-webapp:latest
    container_name: pink
    environment:
      APP_COLOR: pink
      DBHOST: mysql
      DBPWD: password
      DBPORT: 3306
      DBUSER: root
    ports:
      - "8082:8080"
    depends_on:
      - mysql
    networks:
      - clo835-net

  lime:
    image: ap1110/clo835-webapp:latest
    container_name: lime
    environment:
      APP_COLOR: lime
      DBHOST: mysql
      DBPWD: password
      DBPORT: 3306
      DBUSER: root
    ports:
      - "8083:8080"
    depends_on:
      - mysql
    networks:
      - clo835-net

networks:
  clo835-net:
    external: true
